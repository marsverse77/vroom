name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launch-check
          github-token: ${{ github.token }}
          run-id: 45193860068
      - name: Inspect the cached launch screenshot
        run: |
          convert cached.png -resize 800x -quality 75 title.jpg
          echo VROOM_PREVIEW_BEGIN
          base64 -w 120 title.jpg
          echo VROOM_PREVIEW_END
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VroomBuddies-fixed
          path: VroomBuddies-fixed.apk
      - run: bash gradlew :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 300
          script: python3 tools/test_launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: launch-check/
