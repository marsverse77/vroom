name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VroomBuddies-fixed
          path: VroomBuddies-fixed.apk
      - run: bash gradlew :app:testDebugUnitTest
      - name: Prepare screenshot checks
        run: python3 -c "from PIL import Image" || python3 -m pip install Pillow
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 300
          script: python3 tools/test_launch.py
      - name: Assemble visual review from Android captures
        run: python3 tools/showroom_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: launch-check/

  courses:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: VroomBuddies-fixed
      - run: python3 -c "from PIL import Image" || python3 -m pip install Pillow
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 300
          script: python3 tools/test_courses.py ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-courses-${{ matrix.group }}
          path: launch-check/

  inspect-prior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45927355875
          name: launch-check
          path: trace
      - name: Inspect the end of the failed race
        run: |
          ls trace
          tail -100 trace/cached.log | cut -c 1-320
          rg 'Frame intervals|Course ready|Race frame|Choreographer|PowerManagerService.*(sleep|wake)|ANR in|am_anr|moved to background|ActivityTaskManager.*(STOP|PAUSE)|Fatal signal|BufferQueueProducer.*disconnect' trace/cached.log | tail -70 | cut -c 1-360
