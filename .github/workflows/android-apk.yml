name: Android APK
on:
  push:
    branches: ["diagnostics/fixed-view-race-cost"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:assembleRelease :ui-probe:assembleDebug
      - run: cp app/build/outputs/apk/release/app-release.apk VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VroomBuddies-fixed
          path: VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: layout-probe
          path: tools/ui-probe/build/outputs/apk/debug/ui-probe-debug.apk
      - run: bash gradlew :app:testDebugUnitTest
  tablet:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: layout-probe
      - uses: actions/download-artifact@v4
        with:
          name: VroomBuddies-fixed
      - name: Prepare screenshot checks
        run: python3 -c "from PIL import Image" || python3 -m pip install Pillow
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 300
          script: python3 tools/test_courses.py
