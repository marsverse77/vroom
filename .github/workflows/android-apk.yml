name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VroomBuddies-fixed
          path: VroomBuddies-fixed.apk
      - run: bash gradlew :app:testDebugUnitTest
