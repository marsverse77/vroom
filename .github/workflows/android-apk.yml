name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: bash gradlew :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk VroomBuddies-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VroomBuddies-fixed
          path: VroomBuddies-fixed.apk
      - run: bash gradlew :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 300
          script: python3 tools/test_launch.py
      - name: Assemble visual review from Android captures
        run: |
          python3 -c "from PIL import Image" || python3 -m pip install Pillow
          python3 tools/showroom_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: launch-check/
